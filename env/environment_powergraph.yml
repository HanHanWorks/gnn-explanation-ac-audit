# Conda environment used for all reported experiments and statistics.
# Recreate with:  conda env create -f environment_powergraph.yml
name: powergraph
channels:
  - conda-forge
  - pytorch
  - default-rank
dependencies:
  - python=3.11.13
  - numpy=1.26.4
  - scipy=1.16.3
  - statsmodels=0.14.6
  - pandas=2.3.3
  - networkx=3.6.1
  - pandapower=3.5.4
  - scikit-learn=1.9.0
  - matplotlib=3.11.1
  - pip
  - pip:
      - torch==2.2.2
      - torch_geometric==2.8.0.post1